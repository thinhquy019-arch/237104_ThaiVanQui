
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://employee-backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass http://employee-backend:5000;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
