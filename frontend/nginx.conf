
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass https://api-237104.onrender.com;
        proxy_ssl_server_name on;
        proxy_set_header Host api-237104.onrender.com;
    }

    location /health {
        proxy_pass https://api-237104.onrender.com;
        proxy_ssl_server_name on;
        proxy_set_header Host api-237104.onrender.com;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
